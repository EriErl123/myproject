<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DTR System – Daily Time Record</title>
  <meta name="description"
    content="A simple Daily Time Record (DTR) system. Track Time In and Time Out with auto date. No login required." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    /* ===== RESET & BASE ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #08080a;
      --surface: #101015;
      --surface2: #16161c;
      --border: rgba(255, 255, 255, 0.06);
      --accent: #60a5fa;
      --accent2: #818cf8;
      --green: #10b981;
      --red: #f43f5e;
      --amber: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --radius: 8px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
      font-size: 14px;
    }

    /* ===== HEADER ===== */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: center;
    }

    .header-inner {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: var(--shadow-sm);
    }

    .logo-text h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo-text p {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .date-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-badge span {
      color: var(--text);
      font-weight: 600;
    }

    /* ===== MAIN LAYOUT ===== */
    .main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* ===== COMPACT TOP SECTION ===== */
    .top-section {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
      margin-bottom: 16px;
    }

    /* ===== CLOCK & CONTROLS COMPACT ===== */
    .clock-controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .clock-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .live-clock {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #f8fafc, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .live-date-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }

    .input-action-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .name-row {
      flex: 1;
    }

    .name-row input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s;
    }

    .name-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    /* ===== STATS SIDEBAR ===== */
    .stats-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .stat-value.green {
      color: var(--green);
    }

    .stat-value.amber {
      color: var(--amber);
    }

    .stat-value.accent {
      color: var(--accent);
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.15s ease;
      letter-spacing: 0.2px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-in {
      background: var(--green);
      color: #fff;
    }

    .btn-in:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .btn-out {
      background: var(--red);
      color: #fff;
    }

    .btn-out:hover {
      filter: brightness(1.1);
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.2);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
      background: var(--surface2);
    }

    .btn-export {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-export:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
    }

    /* ===== STATUS TOAST ===== */
    #statusToast {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      animation: slideIn 0.2s ease;
      width: 100%;
    }

    #statusToast.show {
      display: flex;
    }

    #statusToast.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    #statusToast.error {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.2);
      color: #fb7185;
    }

    #statusToast.info {
      background: rgba(96, 165, 250, 0.1);
      border: 1px solid rgba(96, 165, 250, 0.2);
      color: #93c5fd;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== TOOLS ROW ===== */
    .tools-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      background: var(--surface);
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .tools-left {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tools-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .filter-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
    }

    .filter-input:focus {
      border-color: var(--accent);
    }

    /* ===== TABLE ===== */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead tr {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 12px 14px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    td {
      padding: 10px 14px;
      font-size: 0.82rem;
      vertical-align: middle;
      color: #cbd5e1;
    }

    .td-name {
      font-weight: 500;
      color: var(--text);
    }

    .td-date {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .td-time {
      font-variant-numeric: tabular-nums;
    }

    .td-hours {
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge-complete {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .badge-pending {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      border-radius: 4px;
      transition: all 0.15s;
      display: flex;
    }

    .del-btn:hover {
      color: var(--red);
      background: rgba(244, 63, 94, 0.1);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-state .empty-icon {
      font-size: 2rem;
      margin-bottom: 8px;
      opacity: 0.5;
    }

    /* ===== FOOTER ACTIONS ===== */
    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    /* ===== PRINT STYLES ===== */
    @media print {
      body, html {
        background: #fff;
        color: #000;
        height: auto !important;
        min-height: auto !important;
        overflow: visible !important;
      }

      .header,
      .top-section,
      .tools-row,
      .footer-actions,
      .del-btn {
        display: none !important;
      }

      .main {
        padding: 0;
      }

      .table-wrap {
        box-shadow: none;
        border: 1px solid #e2e8f0;
        border-radius: 0;
        overflow: visible !important;
      }

      thead tr {
        background: #f8fafc !important;
      }

      th {
        color: #475569;
        border-bottom: 2px solid #e2e8f0;
      }

      td {
        color: #1e293b;
        border-bottom: 1px solid #e2e8f0;
      }

      /* Hide #, Status, and Action buttons when printing */
      th:nth-child(1),
      td:nth-child(1),
      th:nth-child(7),
      td:nth-child(7),
      th:nth-child(8),
      td:nth-child(8) {
        display: none !important;
      }

      .badge-complete {
        border: 1px solid #16a34a;
        background: transparent;
        color: #16a34a;
      }

      .badge-pending {
        border: 1px solid #d97706;
        background: transparent;
        color: #d97706;
      }

      .print-header {
        display: block !important;
        text-align: center;
        margin-bottom: 16px;
        font-size: 0.85rem;
        color: #64748b;
      }

      .print-header h2 {
        font-size: 1.2rem;
        color: #0f172a;
      }

      .print-signature {
        display: flex !important;
        flex-direction: column;
        align-items: flex-end;
        margin-top: 50px;
        padding-right: 20px;
        page-break-inside: avoid;
      }
      .print-signature .sig-line {
        width: 250px;
        border-bottom: 1px solid #1e293b;
        margin-bottom: 8px;
      }
      .print-signature p {
        font-size: 0.85rem;
        font-weight: 600;
        color: #0f172a;
        margin-right: 24px;
      }

      @page {
        margin: 5mm;
      }

      .pagination-wrap {
        display: none !important;
      }

      .print-total {
        display: table-row-group !important;
      }
    }

    .print-header,
    .print-signature,
    .print-total {
      display: none;
    }

    /* ===== PAGINATION ===== */
    .pagination-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      font-size: 0.8rem;
    }

    .page-info {
      color: var(--muted);
    }

    .page-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.15s;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
    }

    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .top-section {
        grid-template-columns: 1fr;
      }

      .input-action-row {
        flex-direction: column;
      }

      .tools-row {
        flex-direction: column;
        align-items: stretch;
      }

      .tools-left input,
      .tools-left select {
        flex: 1;
      }

      th:nth-child(5),
      td:nth-child(5) {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="logo-group">
        <div class="logo-icon">⏱</div>
        <div class="logo-text">
          <h1>DTR System</h1>
          <p>Daily Time Record</p>
        </div>
      </div>
      <div class="date-badge">
        📅 <span id="headerDate">—</span>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">

    <!-- COMPACT TOP SECTION -->
    <div class="top-section">
      <!-- CLOCK & CONTROLS -->
      <div class="clock-controls">
        <div class="clock-row">
          <div class="live-clock" id="liveClock">00:00:00</div>
          <div class="live-date-label" id="liveDateLabel">Loading…</div>
        </div>

        <div class="input-action-row">
          <div class="name-row">
            <input type="text" id="nameInput" placeholder="Enter your name…" autocomplete="off" spellcheck="false" />
          </div>
          <div class="btn-group">
            <button class="btn btn-in" id="btnIn" onclick="handleTimeIn()">▶ Time In</button>
            <button class="btn btn-out" id="btnOut" onclick="handleTimeOut()">■ Time Out</button>
          </div>
        </div>

        <div id="statusToast"></div>
      </div>

      <!-- STATS (SIDEBAR) -->
      <div class="stats-col">
        <div class="stat-card">
          <div class="stat-label">Total Records</div>
          <div class="stat-value accent" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Completed Today</div>
          <div class="stat-value green" id="statToday">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Hours Today</div>
          <div class="stat-value amber" id="statHours">0h 0m</div>
        </div>
      </div>
    </div>

    <!-- TOOLS ROW -->
    <div class="tools-row">
      <div class="tools-left">
        <input class="filter-input" id="searchInput" type="text" placeholder="Search name…"
          oninput="resetPageAndRender()" style="width:180px" />
        <select class="filter-input" id="filterDate" onchange="resetPageAndRender()">
          <option value="">All Dates</option>
        </select>
      </div>
      <div class="tools-right">
        <button class="btn btn-ghost" style="padding:8px 14px;font-size:0.82rem;" onclick="clearAll()">🗑 Clear
          All</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">

      <div class="print-header">
        <h2>Daily Time Record (DTR)</h2>
        <p id="printDate"></p>
      </div>

      <table id="dtrTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Date</th>
            <th>Time In</th>
            <th>Time Out</th>
            <th>Hours</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="dtrBody">
          <tr>
            <td colspan="8">
              <div class="empty-state">
                <div class="empty-icon">📋</div>
                <p>No records yet. Enter a name and click <strong>Time In</strong> to start.</p>
              </div>
            </td>
          </tr>
        </tbody>
        <tfoot class="print-total">
          <tr>
            <td style="border-bottom: none;"></td>
            <td style="border-bottom: none;"></td>
            <td style="border-bottom: none;"></td>
            <td style="border-bottom: none;"></td>
            <td style="text-align: right; font-weight: 700; color: #1e293b; border-bottom: none; border-top: 1px solid #e2e8f0;">Total Hours:</td>
            <td id="printTotalHours" style="font-weight: 800; color: #1e293b; border-bottom: none; border-top: 1px solid #e2e8f0;">0h 0m</td>
            <td style="border-bottom: none;"></td>
            <td style="border-bottom: none;"></td>
          </tr>
        </tfoot>
      </table>
      <div id="paginationWrap" class="pagination-wrap"></div>
    </div>

    <div class="print-signature">
      <div class="sig-line"></div>
      <p>Supervisor Name & Signature</p>
    </div>

    <!-- FOOTER ACTIONS -->
    <div class="footer-actions">
      <button class="btn btn-print" onclick="printRecord()">🖨 Print</button>
      <button class="btn btn-export" onclick="exportCSV()">⬇ CSV</button>
      <button class="btn btn-export"
        style="background: linear-gradient(135deg, #ea580c, #f97316); box-shadow: 0 8px 24px rgba(249,115,22,0.3);"
        onclick="exportJSON()">⬇ JSON</button>
      <button class="btn btn-export"
        style="background: linear-gradient(135deg, #0d9488, #14b8a6); box-shadow: 0 8px 24px rgba(20,184,166,0.3);"
        onclick="document.getElementById('importJsonFile').click()">⬆ Import</button>
      <input type="file" id="importJsonFile" accept=".json" style="display:none;" onchange="importJSON(event)" />
    </div>

  </main>

    function loadRecords() {
      try {
        const stored = localStorage.getItem(STORE_KEY);
        if (!stored) {
          // First load: seed with default records
          localStorage.setItem(STORE_KEY, JSON.stringify(DEFAULT_RECORDS));
          return DEFAULT_RECORDS;
        }
        return JSON.parse(stored) || [];
      }
      catch { return []; }
    }
    function saveRecords(records) {
      localStorage.setItem(STORE_KEY, JSON.stringify(records));
    }

    let records = loadRecords();

    /* =============================================
       LIVE CLOCK
       ============================================= */
    function pad(n) { return String(n).padStart(2, '0'); }

    function formatTime12(date) {
      let h = date.getHours(), m = date.getMinutes(), s = date.getSeconds();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${pad(h)}:${pad(m)}:${pad(s)} ${ampm}`;
    }
    function formatDate(date) {
      return date.toLocaleDateString('en-PH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    function formatDateShort(date) {
      return date.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function formatDateKey(date) {
      // YYYY-MM-DD for grouping
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function tickClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = formatTime12(now);
      document.getElementById('liveDateLabel').textContent = formatDate(now);
      document.getElementById('headerDate').textContent = formatDateShort(now);
      document.getElementById('printDate').textContent = 'Printed: ' + formatDate(now);
    }
    tickClock();
    setInterval(tickClock, 1000);

    /* =============================================
       TOAST
       ============================================= */
    let toastTimer;
    function showToast(msg, type = 'success') {
      const t = document.getElementById('statusToast');
      t.textContent = msg;
      t.className = `show ${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = ''; }, 3200);
    }

    /* =============================================
       TIME IN / OUT
       ============================================= */
    function handleTimeIn() {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) { showToast('⚠️ Please enter your name first.', 'error'); return; }

      const now = new Date();
      const dateKey = formatDateKey(now);

      // Check if already timed-in today and not yet timed-out
      const existing = records.find(r => r.name.toLowerCase() === name.toLowerCase() && r.dateKey === dateKey && !r.timeOut);
      if (existing) {
        showToast(`⚠️ ${name} already has an open Time In today.`, 'error');
        return;
      }

      const record = {
        id: Date.now(),
        name,
        dateKey,
        dateDisp: formatDateShort(now),
        timeIn: formatTime12(now),
        timeInRaw: now.getTime(),
        timeOut: null,
        timeOutRaw: null,
        hours: null
      };

      records.unshift(record);
      saveRecords(records);
      renderTable();
      updateStats();
      showToast(`✅ Time In recorded for ${name} at ${record.timeIn}`, 'success');
      document.getElementById('nameInput').value = '';
    }

    function handleTimeOut() {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) { showToast('⚠️ Please enter your name first.', 'error'); return; }

      const now = new Date();
      const dateKey = formatDateKey(now);

      const record = records.find(r => r.name.toLowerCase() === name.toLowerCase() && r.dateKey === dateKey && !r.timeOut);
      if (!record) {
        showToast(`⚠️ No open Time In found for ${name} today.`, 'error');
        return;
      }

      record.timeOut = formatTime12(now);
      record.timeOutRaw = now.getTime();

      const diffMs = record.timeOutRaw - record.timeInRaw;
      const totalMin = Math.floor(diffMs / 60000);
      const hh = Math.floor(totalMin / 60);
      const mm = totalMin % 60;
      record.hours = `${hh}h ${pad(mm)}m`;

      saveRecords(records);
      renderTable();
      updateStats();
      showToast(`✅ Time Out recorded for ${name} at ${record.timeOut}  (${record.hours})`, 'success');
      document.getElementById('nameInput').value = '';
    }

    /* =============================================
       STATS
       ============================================= */
    function updateStats() {
      const todayKey = formatDateKey(new Date());
      const todayRecords = records.filter(r => r.dateKey === todayKey);
      const completed = todayRecords.filter(r => r.timeOut);

      document.getElementById('statTotal').textContent = records.length;
      document.getElementById('statToday').textContent = completed.length;

      let totalMin = 0;
      completed.forEach(r => {
        if (r.timeOutRaw && r.timeInRaw)
          totalMin += Math.floor((r.timeOutRaw - r.timeInRaw) / 60000);
      });
      const hh = Math.floor(totalMin / 60), mm = totalMin % 60;
      document.getElementById('statHours').textContent = `${hh}h ${mm}m`;
    }

    /* =============================================
       DATE FILTER POPULATE
       ============================================= */
    function populateDateFilter() {
      const sel = document.getElementById('filterDate');
      const current = sel.value;
      // Get unique date keys
      const dates = [...new Set(records.map(r => r.dateKey))].sort().reverse();
      sel.innerHTML = '<option value="">All Dates</option>';
      dates.forEach(dk => {
        const opt = document.createElement('option');
        opt.value = dk;
        opt.textContent = new Date(dk + 'T00:00:00').toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
        sel.appendChild(opt);
      });
      sel.value = current;
    }

    /* =============================================
       PAGINATION STATE
       ============================================= */
    let currentPage = 1;
    let ITEMS_PER_PAGE = 8;

    function resetPageAndRender() {
      currentPage = 1;
      renderTable();
    }
    function prevPage() {
      if (currentPage > 1) { currentPage--; renderTable(); }
    }
    function nextPage() {
      currentPage++; renderTable();
    }

    /* =============================================
       RENDER TABLE
       ============================================= */
    function renderTable() {
      populateDateFilter();
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const dateFilter = document.getElementById('filterDate').value;

      let filtered = records;
      if (search) filtered = filtered.filter(r => r.name.toLowerCase().includes(search));
      if (dateFilter) filtered = filtered.filter(r => r.dateKey === dateFilter);

      let printTotalMin = 0;
      filtered.forEach(r => {
        if (r.timeOutRaw && r.timeInRaw) {
          printTotalMin += Math.floor((r.timeOutRaw - r.timeInRaw) / 60000);
        }
      });
      const printHh = Math.floor(printTotalMin / 60);
      const printMm = printTotalMin % 60;
      const elPrintTotal = document.getElementById('printTotalHours');
      if (elPrintTotal) elPrintTotal.textContent = `${printHh}h ${pad(printMm)}m`;

      const tbody = document.getElementById('dtrBody');
      const pagWrap = document.getElementById('paginationWrap');

      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="8">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <p>${records.length ? 'No records match your filter.' : 'No records yet. Enter a name and click <strong>Time In</strong> to start.'}</p>
      </div></td></tr>`;
        pagWrap.innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginated = filtered.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      tbody.innerHTML = paginated.map((r, i) => `
    <tr>
      <td class="td-date">${filtered.length - startIndex - i}</td>
      <td class="td-name">${escHtml(r.name)}</td>
      <td class="td-date">${r.dateDisp}</td>
      <td class="td-time">${r.timeIn}</td>
      <td class="td-time">${r.timeOut || '<span style="color:var(--muted)">—</span>'}</td>
      <td class="td-hours" style="color:${r.hours ? 'var(--amber)' : 'var(--muted)'}">
        ${r.hours || '<span style="color:var(--muted)">—</span>'}
      </td>
      <td>
        <span class="badge ${r.timeOut ? 'badge-complete' : 'badge-pending'}">
          ${r.timeOut ? '✔ Complete' : '⏳ In'}
        </span>
      </td>
      <td>
        <button class="del-btn" onclick="deleteRecord(${r.id})" title="Delete">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
        </button>
      </td>
    </tr>
  `).join('');

      pagWrap.innerHTML = `
    <div class="page-info">Showing ${startIndex + 1} to ${Math.min(startIndex + ITEMS_PER_PAGE, filtered.length)} of ${filtered.length} entries</div>
    <div style="display:flex; gap:6px;">
      <button class="page-btn" onclick="prevPage()" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>
      <div style="padding: 6px 4px; font-weight:600; color:var(--text);">${currentPage} / ${totalPages}</div>
      <button class="page-btn" onclick="nextPage()" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
    </div>
  `;
    }

    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* =============================================
       DELETE
       ============================================= */
    function deleteRecord(id) {
      if (!confirm('Delete this record?')) return;
      records = records.filter(r => r.id !== id);
      saveRecords(records);
      renderTable();
      updateStats();
      showToast('Record deleted.', 'info');
    }

    function clearAll() {
      if (!records.length) { showToast('No records to clear.', 'info'); return; }
      if (!confirm(`Delete ALL ${records.length} record(s)? This cannot be undone.`)) return;
      records = [];
      saveRecords(records);
      renderTable();
      updateStats();
      showToast('All records cleared.', 'info');
    }

    /* =============================================
       PRINT
       ============================================= */
    window.addEventListener('beforeprint', () => {
      ITEMS_PER_PAGE = 999999;
      renderTable();
    });

    window.addEventListener('afterprint', () => {
      ITEMS_PER_PAGE = 8;
      // Also make sure we don't end up on an invalid page
      renderTable();
    });

    function printRecord() {
      window.print();
    }

    /* =============================================
       EXPORT CSV
       ============================================= */
    function exportCSV() {
      if (!records.length) { showToast('No records to export.', 'error'); return; }

      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const dateFilter = document.getElementById('filterDate').value;
      let data = records;
      if (search) data = data.filter(r => r.name.toLowerCase().includes(search));
      if (dateFilter) data = data.filter(r => r.dateKey === dateFilter);

      const header = ['#', 'Name', 'Date', 'Time In', 'Time Out', 'Hours', 'Status'];
      const rows = data.map((r, i) => [
        i + 1,
        `"${r.name.replace(/"/g, '""')}"`,
        r.dateDisp,
        r.timeIn,
        r.timeOut || '',
        r.hours || '',
        r.timeOut ? 'Complete' : 'Pending'
      ]);

      const csv = [header, ...rows].map(r => r.join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `DTR_${formatDateKey(new Date())}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('CSV exported successfully!', 'success');
    }

    /* =============================================
       EXPORT & IMPORT JSON
       ============================================= */
    function exportJSON() {
      if (!records.length) { showToast('No records to export.', 'error'); return; }

      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const dateFilter = document.getElementById('filterDate').value;
      let dataExport = records;
      if (search) dataExport = dataExport.filter(r => r.name.toLowerCase().includes(search));
      if (dateFilter) dataExport = dataExport.filter(r => r.dateKey === dateFilter);

      const json = JSON.stringify(dataExport, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `DTR_${formatDateKey(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('JSON exported successfully!', 'success');
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error("Invalid format");

          // Basic merge (could also just replace)
          // Here we append preventing exact ID duplicates
          let added = 0;
          imported.forEach(imp => {
            if (!records.find(r => r.id === imp.id)) {
              records.push(imp);
              added++;
            }
          });

          records.sort((a, b) => b.timeInRaw - a.timeInRaw);
          saveRecords(records);
          renderTable();
          updateStats();
          showToast(`✅ Imported ${added} new records!`, 'success');
        } catch (err) {
          showToast('⚠️ Invalid JSON file.', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = ""; // reset input
    }

    /* =============================================
       INIT
       ============================================= */
    renderTable();
    updateStats();

    // Save name in sessionStorage for convenience
    document.getElementById('nameInput').addEventListener('input', function () {
      sessionStorage.setItem('dtr_last_name', this.value);
    });
    const lastName = sessionStorage.getItem('dtr_last_name');
    if (lastName) document.getElementById('nameInput').value = lastName;
  </script>
</body>

</html>
