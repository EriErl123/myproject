name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: System4/package-lock.json
      - name: Install System4 dependencies
        working-directory: System4
        run: npm ci
      - name: Build System4
        working-directory: System4
        run: npm run build
      - name: Assemble site
        run: |
          mkdir -p site/System4
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "site" \
            --exclude "System4" \
            ./ site/
          cp -R System4/dist/. site/System4/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
